server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Es una SPA: cualquier ruta que no sea un archivo real la resuelve el router
  # de React, así que se devuelve index.html en vez de un 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los assets de Vite llevan hash en el nombre, así que se pueden cachear fuerte.
  location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;
}
